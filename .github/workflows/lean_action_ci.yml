name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space and install bubblewrap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"

      - name: Verify solution against Challenge with comparator
        run: lake comparator --config comparator/all.json

      - name: Cache Verso literate build
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/verso/.lake/build
            .lake/packages/subverso/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/illuminate/.lake/build
            .lake/build/literate
          key: verso-literate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            verso-literate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build Verso literate HTML
        id: verso
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          # Work around Verso v4.35.0-rc4 passing `module`-mode setup.importArts (which omits
          # `.olean.private`) to `importModules (level := .private)` in `verso-literate`.
          sed -i 's/let setup ← ModuleSetup.load file/let _setup ← ModuleSetup.load file/; s/importArts := setup.importArts/importArts := {}/' .lake/packages/verso/src/verso-literate/VersoLiterateMain.lean
          path=$(lake query :literateHtml)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          rm -rf .lake/packages/mathlib .lake/build/lib .lake/build/ir

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.verso.outputs.path }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
