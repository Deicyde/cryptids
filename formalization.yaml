automation:
  methods:
    - method: "agent"
      models:
        - "Gemini Argon"
      framework: "Antigravity + experimental harness"
      tool_setup: "Lean 4 (v4.35.0-rc4), Mathlib"
      cost:
        wall_time: ""
        spend_usd: ""
        hardware: ""
      prompting_notes: ""
  spend_usd: ""
  notes: >-
    Candidate state reductions and halting-equivalence proofs were discovered
    using Gemini Argon with an experimental harness; end-to-end
    semantics proofs were developed interactively using Gemini Argon.

fidelity:
  divergences: >-
    During the formal verification of zf_432_wade.tm (Cryptids/Semantics/Zf/Subroutines.lean),
    we discovered that the baseline machine zf_432_wade.tm was compiled prior to
    Andrew Wade's commit 10fcf152b3 ("Bugfix for B6a where correct variables were
    not being restored"), causing state 299 (main().n_140.1) to restore scratch1
    into param1 instead of param3. We formalize both the exact 20-clause system
    WadeZFProvable enumerated by zf_432_wade.tm and O'Rear's intended Hilbert
    system ZFProvable (proved sound in Mathlib's ZFSet.{0}), which zf_393
    (compiled after commit 10fcf152b3) enumerates directly.

review:
  status: "self-assessed"
  reviewers:
    - "Maxence Faldor"
    - "Moritz Firsching"
    - "Eric Wieser"
  notes: "Verified with Lean 4 (v4.35.0-rc4), leanprover/comparator, and standalone Python verifier verify.py."

alignment:
  namespace: "ConjectureMachines"
  statements:
    - source: "goldbach_21 <-> goldbach_25 halting equivalence"
      lean: "ConjectureMachines.Goldbach21.candidate_equivalent"
      module: "Cryptids.Goldbach21"
      status: "proved"
    - source: "goldbach_21 <-> ¬ GoldbachConjecture"
      lean: "ConjectureMachines.Goldbach21.Semantics.halts_candidate_iff_not_goldbach"
      module: "Cryptids.Semantics.Goldbach"
      status: "proved"
    - source: "zf_380 <-> zf_393 halting equivalence"
      lean: "ConjectureMachines.Zf380.candidate_equivalent"
      module: "Cryptids.Zf380"
      status: "proved"
    - source: "zf_380 <-> ZFInconsistent"
      lean: "ConjectureMachines.Zf380.Semantics.halts_candidate_iff_zfInconsistent"
      module: "Cryptids.Semantics.Zf393"
      status: "proved"
    - source: "Unconditional non-halting of zf_380"
      lean: "ConjectureMachines.Zf380.Semantics.not_halts_candidate"
      module: "Cryptids.Semantics.Zf393"
      status: "proved"
    - source: "zf_432 <-> WadeZFInconsistent"
      lean: "ConjectureMachines.Semantics.Zf.halts_zf432_iff_wadeZFInconsistent"
      module: "Cryptids.Semantics.Zf"
      status: "proved"
    - source: "Soundness of ZFProvable in ZFSet.{0}"
      lean: "ConjectureMachines.Semantics.Zf.not_zfInconsistent"
      module: "Cryptids.Semantics.Zf.Soundness"
      status: "proved"
    - source: "zf_393 <-> ZFInconsistent"
      lean: "ConjectureMachines.Zf393.halts_zf393_iff_zfInconsistent"
      module: "Cryptids.Semantics.Zf393"
      status: "proved"
    - source: "Unconditional non-halting of zf_393"
      lean: "ConjectureMachines.Zf393.not_halts_zf393"
      module: "Cryptids.Semantics.Zf393"
      status: "proved"
    - source: "riemann_543 <-> riemann_744 halting equivalence"
      lean: "ConjectureMachines.Riemann543.candidate_equivalent"
      module: "Cryptids.Riemann543"
      status: "proved"
    - source: "riemann_543 <-> ∃ x, MatiyasevichRiemannCounterexample x"
      lean: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_exists_counterexample"
      module: "Cryptids.Semantics.Riemann"
      status: "proved"
    - source: "riemann_543 <-> ¬ RiemannHypothesis"
      lean: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_not_riemannHypothesis"
      module: "Cryptids.Semantics.Riemann"
      status: "proved"
    - source: "riemann_120 <-> ¬ RiemannHypothesis"
      lean: "ConjectureMachines.Riemann120.halts_riemann120_iff_not_riemannHypothesis"
      module: "Cryptids.Semantics.Riemann120"
      status: "proved"

