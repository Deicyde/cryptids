# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Cryptids: Certified State Reductions and Semantics of Conjecture-Checking Turing Machines"
  description: >-
    Formal Lean 4 verification of state-reduced 2-symbol Turing machines for
    Goldbach's Conjecture (25 -> 24 states), ZF Set Theory Consistency
    (432 -> 429 states, via 431 and 430), and the Riemann Hypothesis
    (744 -> 543 states), proving halting equivalence with the historical
    baseline machines (zf_432 from 2025 and riemann_744 from 2016) and
    connecting each machine's halting behavior to the corresponding statement
    in Mathlib. While goldbach_24 improves on the smallest known binary
    Goldbach machine, for ZF Consistency and the Riemann Hypothesis we do not
    claim the smallest overall state counts (smaller unformalized machines with
    393 and 120 states were recently constructed by Wade and Shunia via
    compiler and algorithmic reworks).
  authors:
    - "Maxence Faldor"
    - "Moritz Firsching"
  responsible_maintainers:
    - "Maxence Faldor"
    - "Moritz Firsching"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.LO"
    - "math.NT"
  msc2020:
    - "03D10"
    - "03E30"
    - "11M26"
    - "11P32"
    - "68Q04"

sources:
  - title: "Certified State Reductions and Formal Semantics of Conjecture-Checking Turing Machines (goldbach_24, zf_431/430/429, riemann_543)"
    authors:
      - "Maxence Faldor"
      - "Moritz Firsching"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original state reductions (goldbach_25 -> 24, zf_432 -> 431/430/429,
      riemann_744 -> 543), halting-equivalence proofs, and first Lean 4
      semantics proofs for ZF and RH Turing machines, including the formal
      discovery of the B6a register-restoration bug in zf_432_wade.tm. For ZF
      and RH we do not claim overall record state counts.
  - title: "A Relatively Small Turing Machine Whose Behavior Is Independent of ZFC"
    authors:
      - "Adam Yedidia"
      - "Scott Aaronson"
    id: "https://arxiv.org/abs/1605.04343"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "metamath-turing-machines (riemann.nql and zf2.nql)"
    authors:
      - "Stefan O'Rear"
      - "Yuri Matiyasevich"
      - "Scott Aaronson"
    id: "https://github.com/sorear/metamath-turing-machines"
    type: "software"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "turing_machine_explorer (zf2.py / zf_432 and Aug 2026 393-state update)"
    authors:
      - "Andrew Wade"
    id: "https://codeberg.org/ajwade/turing_machine_explorer"
    type: "software"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Provides the August 2025 432-state baseline zf_432_wade.tm (commit
      33b30300) formalized and reduced here to 429 states; a later August 2026
      compiler and axiom-order rework (commit 9c5c2e82) reaches 393 states
      (unformalized).
  - title: "A 120-State Binary Turing Machine Equivalent to the Riemann Hypothesis"
    authors:
      - "Joseph M. Shunia"
    id: "https://arxiv.org/abs/2609.30306"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Constructs an unformalized 120-state binary Turing machine equivalent to
      the Riemann Hypothesis via a 5-register self-sieving recurrence on a
      specialized TMBuilder backend (September 2026).
  - title: "Sharper bounds for the Chebyshev functions theta(x) and psi(x). II"
    authors:
      - "Lowell Schoenfeld"
    id: "https://doi.org/10.1090/S0025-5718-1976-0457374-X"
    type: "article"
    location: "Theorem 10, Math. Comp. 30 (1976), 337-360"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Uber die Anzahl der Primzahlen unter gegebener Grenze"
    authors:
      - "Erhard Schmidt"
    id: "https://doi.org/10.1007/BF01444344"
    type: "article"
    location: "Math. Ann. 57 (1903), 195-204"
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lengyijun/goldbach_tm"
    relationship: "independent"
    note: >-
      Yijun Leng (2024) constructed the 25-state baseline machine goldbach_25
      and gave the first Lean 4 proof of its Goldbach semantics; our
      Cryptids/Goldbach24.lean and Cryptids/Semantics/Goldbach.lean are
      developed from scratch.

status:
  scope: >-
    All five state-reduction halting equivalences (goldbach_24, zf_431,
    zf_430, zf_429, riemann_543), the end-to-end Goldbach semantics
    (Cryptids/Semantics/Goldbach.lean), the end-to-end ZF consistency
    semantics and soundness in Mathlib's ZFSet.{0} (Cryptids/Semantics/Zf.lean),
    and the end-to-end Riemann Hypothesis semantics including the NQL
    register-machine verification, Schmidt's (1903) oscillation theorem, and
    Schoenfeld's (1976) explicit Chebyshev bound
    (Cryptids/Semantics/Riemann.lean) are proved with zero sorrys.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ConjectureMachines.Goldbach24.candidate_equivalent"
      file: "Cryptids/Goldbach24.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/goldbach_24.json"
    - declaration: "ConjectureMachines.Goldbach24.Semantics.halts_candidate_iff_not_goldbach"
      file: "Cryptids/Semantics/Goldbach.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/goldbach_semantics.json"
    - declaration: "ConjectureMachines.Zf429.candidate_equivalent"
      file: "Cryptids/Zf429.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_429.json"
    - declaration: "ConjectureMachines.Semantics.Zf.halts_candidate_429_iff_wadeZFInconsistent"
      file: "Cryptids/Semantics/Zf.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_semantics.json"
    - declaration: "ConjectureMachines.Semantics.Zf.not_zfInconsistent"
      file: "Cryptids/Semantics/Zf/Soundness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_semantics.json"
    - declaration: "ConjectureMachines.Riemann543.candidate_equivalent"
      file: "Cryptids/Riemann543.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/riemann_543.json"
    - declaration: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_exists_counterexample"
      file: "Cryptids/Semantics/Riemann.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/riemann_semantics.json"
    - declaration: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_not_riemannHypothesis"
      file: "Cryptids/Semantics/Riemann.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/riemann_semantics.json"

automation:
  methods:
    - method: "agent"
      models:
        - "Gemini Argon"
      framework: "Antigravity + experimental harness"
      tool_setup: "Lean 4 (v4.35.0-rc4), Mathlib"
      cost:
        wall_time: ""
        spend_usd: ""
        hardware: ""
      prompting_notes: ""
  spend_usd: ""
  notes: >-
    Candidate state reductions and halting-equivalence proofs were discovered
    using Gemini Argon with an experimental harness; end-to-end
    semantics proofs were developed interactively using Gemini Argon.

fidelity:
  divergences: >-
    During the formal verification of zf_432_wade.tm (Cryptids/Semantics/Zf/Subroutines.lean),
    we discovered that the baseline machine zf_432_wade.tm was compiled prior to
    Andrew Wade's commit 10fcf152b3 ("Bugfix for B6a where correct variables were
    not being restored"), causing state 299 (main().n_140.1) to restore scratch1
    into param1 instead of param3. We formalize both the exact 20-clause system
    WadeZFProvable enumerated by zf_432_wade.tm and O'Rear's intended Hilbert
    system ZFProvable (proved sound in Mathlib's ZFSet.{0}).

review:
  status: "self-assessed"
  reviewers:
    - "Maxence Faldor"
    - "Moritz Firsching"
    - "Eric Wieser"
  notes: "Verified with Lean 4 (v4.35.0-rc4), leanprover/comparator, and standalone Python verifier verify.py."

alignment:
  namespace: "ConjectureMachines"
  statements:
    - source: "goldbach_24 <-> goldbach_25 halting equivalence"
      lean: "ConjectureMachines.Goldbach24.candidate_equivalent"
      module: "Cryptids.Goldbach24"
      status: "proved"
    - source: "goldbach_24 <-> ¬ GoldbachConjecture"
      lean: "ConjectureMachines.Goldbach24.Semantics.halts_candidate_iff_not_goldbach"
      module: "Cryptids.Semantics.Goldbach"
      status: "proved"
    - source: "zf_429 <-> zf_432 halting equivalence"
      lean: "ConjectureMachines.Zf429.candidate_equivalent"
      module: "Cryptids.Zf429"
      status: "proved"
    - source: "zf_429 <-> WadeZFInconsistent"
      lean: "ConjectureMachines.Semantics.Zf.halts_candidate_429_iff_wadeZFInconsistent"
      module: "Cryptids.Semantics.Zf"
      status: "proved"
    - source: "Soundness of ZFProvable in ZFSet.{0}"
      lean: "ConjectureMachines.Semantics.Zf.not_zfInconsistent"
      module: "Cryptids.Semantics.Zf.Soundness"
      status: "proved"
    - source: "riemann_543 <-> riemann_744 halting equivalence"
      lean: "ConjectureMachines.Riemann543.candidate_equivalent"
      module: "Cryptids.Riemann543"
      status: "proved"
    - source: "riemann_543 <-> ∃ x, MatiyasevichRiemannCounterexample x"
      lean: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_exists_counterexample"
      module: "Cryptids.Semantics.Riemann"
      status: "proved"
    - source: "riemann_543 <-> ¬ RiemannHypothesis"
      lean: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_not_riemannHypothesis"
      module: "Cryptids.Semantics.Riemann"
      status: "proved"

