# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Cryptids: Certified State Reductions and Semantics of Conjecture-Checking Turing Machines"
  description: >-
    Formal Lean 4 verification of 2-symbol Turing machines for Goldbach's
    Conjecture (25 -> 21 states), ZF Set Theory Consistency (393 -> 380 states
    reducing Andrew Wade's August 2026 machine zf_393, plus Wade's August 2025
    432-state machine zf_432), and the Riemann Hypothesis (744 -> 543 states,
    plus Joseph M. Shunia's September 2026 120-state machine riemann_120),
    proving halting equivalences and connecting every machine's blank-tape
    halting behavior to the corresponding statement in Mathlib.
  authors:
    - "Maxence Faldor"
    - "Moritz Firsching"
  responsible_maintainers:
    - "Maxence Faldor"
    - "Moritz Firsching"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.LO"
    - "math.NT"
  msc2020:
    - "03D10"
    - "03E30"
    - "11M26"
    - "11P32"
    - "68Q04"

sources:
  - title: "Certified State Reductions and Formal Semantics of Conjecture-Checking Turing Machines (goldbach_21, zf_380, zf_393, zf_432, riemann_543, riemann_120)"
    authors:
      - "Maxence Faldor"
      - "Moritz Firsching"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original state reductions (goldbach_25 -> 21, zf_393 -> 380,
      riemann_744 -> 543), halting-equivalence proofs, and first Lean 4
      semantics proofs for all five ZF and RH Turing machine families (zf_393/380,
      zf_432, riemann_744/543, and riemann_120), including the formal discovery
      of the B6a register-restoration bug in zf_432_wade.tm.
  - title: "A Relatively Small Turing Machine Whose Behavior Is Independent of ZFC"
    authors:
      - "Adam Yedidia"
      - "Scott Aaronson"
    id: "https://arxiv.org/abs/1605.04343"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "metamath-turing-machines (riemann.nql and zf2.nql)"
    authors:
      - "Stefan O'Rear"
      - "Yuri Matiyasevich"
      - "Scott Aaronson"
    id: "https://github.com/sorear/metamath-turing-machines"
    type: "software"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "turing_machine_explorer (zf2.py / zf_432 and Aug 2026 393-state update)"
    authors:
      - "Andrew Wade"
    id: "https://codeberg.org/ajwade/turing_machine_explorer"
    type: "software"
    relationship: "primary"
    author_endorsement: "not-contacted"
    note: >-
      Provides both the August 2025 432-state baseline zf_432_wade.tm (commit
      33b30300, formalized end-to-end in Cryptids/Semantics/Zf.lean) and the
      August 2026 393-state machine zf_393_wade.tm (commit 9c5c2e82, formalized
      end-to-end in Cryptids/Zf393.lean and Cryptids/Semantics/Zf393.lean and
      reduced here to 380 states in Cryptids/Zf380.lean).
  - title: "A 120-State Binary Turing Machine Equivalent to the Riemann Hypothesis"
    authors:
      - "Joseph M. Shunia"
    id: "https://arxiv.org/abs/2609.30306"
    type: "article"
    relationship: "primary"
    author_endorsement: "not-contacted"
    note: >-
      Constructs the 120-state binary Turing machine riemann_120 equivalent to
      the Riemann Hypothesis via a 5-register self-sieving recurrence and
      offset base-n digit count (September 2026); formalized end-to-end here in
      Cryptids/Riemann120.lean and Cryptids/Semantics/Riemann120.lean.
  - title: "Sharper bounds for the Chebyshev functions theta(x) and psi(x). II"
    authors:
      - "Lowell Schoenfeld"
    id: "https://doi.org/10.1090/S0025-5718-1976-0457374-X"
    type: "article"
    location: "Theorem 10, Math. Comp. 30 (1976), 337-360"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Uber die Anzahl der Primzahlen unter gegebener Grenze"
    authors:
      - "Erhard Schmidt"
    id: "https://doi.org/10.1007/BF01444344"
    type: "article"
    location: "Math. Ann. 57 (1903), 195-204"
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lengyijun/goldbach_tm"
    relationship: "independent"
    note: >-
      Yijun Leng (2024) constructed the 25-state baseline machine goldbach_25
      and gave the first Lean 4 proof of its Goldbach semantics; our
      Cryptids/Goldbach21.lean and Cryptids/Semantics/Goldbach.lean are
      developed from scratch.

status:
  scope: >-
    All three state-reduction halting equivalences (goldbach_21, zf_380,
    riemann_543), the end-to-end Goldbach semantics
    (Cryptids/Semantics/Goldbach.lean), the end-to-end ZF consistency semantics
    for both Wade's 393-state machine zf_393 and our 380-state reduction zf_380
    (Cryptids/Semantics/Zf393.lean) including unconditional non-halting via
    soundness in Mathlib's ZFSet.{0} as well as zf_432 (Cryptids/Semantics/Zf.lean),
    and the end-to-end Riemann Hypothesis semantics for both riemann_744/543
    (Cryptids/Semantics/Riemann.lean) and Shunia's 120-state machine
    riemann_120 (Cryptids/Semantics/Riemann120.lean) are proved with zero
    sorrys.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ConjectureMachines.Goldbach21.candidate_equivalent"
      file: "Cryptids/Goldbach21.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/goldbach_21.json"
    - declaration: "ConjectureMachines.Goldbach21.Semantics.halts_candidate_iff_not_goldbach"
      file: "Cryptids/Semantics/Goldbach.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/goldbach_semantics.json"
    - declaration: "ConjectureMachines.Zf380.candidate_equivalent"
      file: "Cryptids/Zf380.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_380.json"
    - declaration: "ConjectureMachines.Zf380.Semantics.halts_candidate_iff_zfInconsistent"
      file: "Cryptids/Semantics/Zf393.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_393.json"
    - declaration: "ConjectureMachines.Zf380.Semantics.not_halts_candidate"
      file: "Cryptids/Semantics/Zf393.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_393.json"
    - declaration: "ConjectureMachines.Semantics.Zf.halts_zf432_iff_wadeZFInconsistent"
      file: "Cryptids/Semantics/Zf.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_semantics.json"
    - declaration: "ConjectureMachines.Semantics.Zf.not_zfInconsistent"
      file: "Cryptids/Semantics/Zf/Soundness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_semantics.json"
    - declaration: "ConjectureMachines.Zf393.halts_zf393_iff_zfInconsistent"
      file: "Cryptids/Semantics/Zf393.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_393.json"
    - declaration: "ConjectureMachines.Zf393.not_halts_zf393"
      file: "Cryptids/Semantics/Zf393.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/zf_393.json"
    - declaration: "ConjectureMachines.Riemann543.candidate_equivalent"
      file: "Cryptids/Riemann543.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/riemann_543.json"
    - declaration: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_exists_counterexample"
      file: "Cryptids/Semantics/Riemann.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/riemann_semantics.json"
    - declaration: "ConjectureMachines.Riemann543.Semantics.halts_candidate_iff_not_riemannHypothesis"
